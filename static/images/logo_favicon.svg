<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <style>
        .circle-chk { stroke: #0c5855; }
        .chk-mark { stroke: #0c5855; }
        .lines { stroke: #4a6b6a; }

        @media (prefers-color-scheme: dark) {
            .circle-chk { stroke: #2dd4bf; }
            .chk-mark { stroke: #ffffff; }
            .lines { stroke: #a5f3fc; }
        }
    </style>
    <!-- Checklist Circular Checkmark -->
    <circle class="circle-chk" cx="28" cy="28" r="16" fill="none" stroke-width="4.5" />
    <path class="chk-mark" d="M21 28 L26 33 L35 20" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Short Lines adjacent to Circle -->
    <line class="lines" x1="54" y1="20" x2="88" y2="20" stroke-width="4.5" stroke-linecap="round" />
    <line class="lines" x1="54" y1="36" x2="88" y2="36" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Full Lines below Circle -->
    <line class="lines" x1="12" y1="56" x2="88" y2="56" stroke-width="4.5" stroke-linecap="round" />
    <line class="lines" x1="12" y1="72" x2="88" y2="72" stroke-width="4.5" stroke-linecap="round" />
    <line class="lines" x1="12" y1="88" x2="88" y2="88" stroke-width="4.5" stroke-linecap="round" />
</svg>
