{% extends 'base.html' %}
{% load static %}

{% block title %}Daily Practice | Command Center{% endblock %}

{% block extra_css %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

    .practice-container {
        max-width: 620px;
        margin: 0 auto;
        padding: 0 16px 60px;
    }

    /* ── Tab Switcher ── */
    .practice-tabs {
        display: flex;
        background: rgba(12, 88, 85, 0.06);
        border: 1px solid rgba(12, 88, 85, 0.12);
        border-radius: 16px;
        padding: 4px;
        margin-bottom: 24px;
    }

    .practice-tab {
        flex: 1;
        padding: 12px 16px;
        border: none;
        background: transparent;
        border-radius: 13px;
        font-family: 'Inter', sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .practice-tab.active {
        background: #fff;
        color: var(--accent-color);
        box-shadow: 0 2px 8px rgba(12, 88, 85, 0.1);
    }

    .practice-tab:hover:not(.active) {
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.4);
    }

    .tab-emoji { font-size: 1.2rem; }

    /* ── Loading Shimmer ── */
    .shimmer-card {
        background: var(--card-bg);
        border: var(--card-border);
        border-radius: 20px;
        padding: 32px 24px;
        animation: shimmerPulse 1.5s infinite ease-in-out;
    }

    .shimmer-line {
        height: 14px;
        background: rgba(12, 88, 85, 0.08);
        border-radius: 8px;
        margin-bottom: 12px;
    }

    .shimmer-line.title { height: 32px; width: 50%; margin: 0 auto 20px; }
    .shimmer-line.subtitle { height: 12px; width: 30%; margin: 0 auto 24px; }
    .shimmer-line.body { width: 90%; }
    .shimmer-line.body-short { width: 65%; }

    @keyframes shimmerPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }

    /* ── Word/Verse Card ── */
    .daily-card {
        background: var(--card-bg);
        border: var(--card-border);
        border-radius: 20px;
        box-shadow: var(--card-shadow);
        backdrop-filter: var(--backdrop-blur);
        overflow: hidden;
        animation: cardFadeIn 0.4s ease;
    }

    @keyframes cardFadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .daily-card-hero {
        background: var(--text-primary);
        color: #fff;
        padding: 32px 24px 28px;
        text-align: center;
    }

    .daily-card-hero .word-title {
        font-family: 'EB Garamond', serif;
        font-size: 2.4rem;
        font-weight: 600;
        line-height: 1.2;
        margin-bottom: 6px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .daily-card-hero .word-category {
        display: inline-block;
        font-family: 'Inter', sans-serif;
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.1);
        padding: 3px 12px;
        border-radius: 20px;
    }

    .daily-card-body {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .info-block {
        background: rgba(12, 88, 85, 0.03);
        border: 1px solid rgba(12, 88, 85, 0.08);
        border-radius: 14px;
        padding: 14px 16px;
    }

    .info-block-label {
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-secondary);
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .info-block-value {
        font-size: 0.92rem;
        color: var(--text-primary);
        line-height: 1.5;
    }

    .info-block-value.definition {
        font-family: 'EB Garamond', serif;
        font-size: 1.15rem;
        line-height: 1.55;
    }

    .info-block-value.verse-text {
        font-family: 'EB Garamond', serif;
        font-size: 1.3rem;
        line-height: 1.65;
    }

    /* ── Learned Button ── */
    .learned-btn {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 14px;
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .learned-btn.primary {
        background: var(--accent-color);
        color: #fff;
    }

    .learned-btn.primary:hover {
        background: #0a4a47;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(12, 88, 85, 0.25);
    }

    .learned-btn.primary:active {
        transform: scale(0.98);
    }

    .learned-btn.done {
        background: rgba(16, 185, 129, 0.1);
        color: #059669;
        cursor: default;
        pointer-events: none;
    }

    /* ── Streak & Past Words ── */
    .section-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 28px 0 16px;
    }

    .section-divider-line {
        flex: 1;
        height: 1px;
        background: rgba(12, 88, 85, 0.08);
    }

    .section-divider-text {
        font-size: 0.78rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-secondary);
        white-space: nowrap;
    }

    .streak-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(245, 158, 11, 0.08);
        border: 1px solid rgba(245, 158, 11, 0.15);
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 0.82rem;
        font-weight: 600;
        color: #d97706;
        margin-bottom: 12px;
    }

    .past-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .past-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-radius: 12px;
        transition: background 0.2s;
    }

    .past-item:hover {
        background: rgba(12, 88, 85, 0.03);
    }

    .past-item-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
    }

    .past-item-date {
        font-size: 0.72rem;
        font-weight: 500;
        color: var(--text-secondary);
        min-width: 70px;
    }

    .past-item-word {
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text-primary);
    }

    .past-item-status {
        font-size: 0.72rem;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 10px;
        flex-shrink: 0;
    }

    .past-item-status.mastered {
        background: rgba(16, 185, 129, 0.1);
        color: #059669;
    }

    .past-item-status.learning {
        background: rgba(245, 158, 11, 0.1);
        color: #d97706;
    }

    /* ── Quick Review Button ── */
    .review-btn {
        width: 100%;
        padding: 14px;
        border: 1px solid rgba(12, 88, 85, 0.15);
        border-radius: 14px;
        background: rgba(12, 88, 85, 0.03);
        font-family: 'Inter', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--accent-color);
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 8px;
    }

    .review-btn:hover {
        background: rgba(12, 88, 85, 0.08);
        border-color: var(--accent-color);
    }

    /* ── Flashcard Review ── */
    .flashcard-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(6px);
        z-index: 999;
        align-items: center;
        justify-content: center;
        padding: 20px;
        animation: fadeInOverlay 0.2s ease;
    }

    .flashcard-overlay.visible {
        display: flex;
    }

    @keyframes fadeInOverlay {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .flashcard {
        background: #fff;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        max-width: 440px;
        width: 100%;
        overflow: hidden;
        animation: cardSlideUp 0.3s ease;
    }

    @keyframes cardSlideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .flashcard-front {
        padding: 40px 24px;
        text-align: center;
    }

    .flashcard-word {
        font-family: 'EB Garamond', serif;
        font-size: 2.2rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 8px;
    }

    .flashcard-prompt {
        font-size: 0.82rem;
        color: var(--text-secondary);
        margin-bottom: 24px;
    }

    .flashcard-answer {
        display: none;
        padding: 0 24px 8px;
        text-align: center;
    }

    .flashcard-answer.revealed {
        display: block;
        animation: cardFadeIn 0.3s ease;
    }

    .flashcard-definition {
        font-family: 'EB Garamond', serif;
        font-size: 1.15rem;
        line-height: 1.5;
        color: var(--text-primary);
        margin-bottom: 8px;
        padding: 16px;
        background: rgba(12, 88, 85, 0.03);
        border-radius: 12px;
    }

    .flashcard-actions {
        padding: 16px 24px 24px;
        display: flex;
        gap: 10px;
    }

    .flashcard-btn {
        flex: 1;
        padding: 14px 12px;
        border: none;
        border-radius: 12px;
        font-family: 'Inter', sans-serif;
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.1s;
    }

    .flashcard-btn:active { transform: scale(0.96); }

    .flashcard-btn.reveal {
        background: var(--accent-color);
        color: #fff;
        width: 100%;
    }

    .flashcard-btn.forgot {
        background: rgba(239, 68, 68, 0.1);
        color: #dc2626;
    }

    .flashcard-btn.got-it {
        background: rgba(16, 185, 129, 0.1);
        color: #059669;
    }

    .flashcard-close {
        position: absolute;
        top: 16px;
        right: 16px;
        background: rgba(0, 0, 0, 0.1);
        border: none;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
    }

    /* ── Empty State ── */
    .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-secondary);
    }

    .empty-state-emoji { font-size: 2.5rem; margin-bottom: 12px; }

    .empty-state-text {
        font-size: 0.9rem;
        line-height: 1.5;
        max-width: 300px;
        margin: 0 auto;
    }

    /* ── Toast ── */
    .practice-toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: var(--text-primary);
        color: #fff;
        font-size: 0.85rem;
        font-weight: 500;
        padding: 10px 20px;
        border-radius: 30px;
        z-index: 1000;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .practice-toast.show {
        transform: translateX(-50%) translateY(0);
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
        .practice-container { padding: 0 10px 40px; }
        .daily-card-hero { padding: 24px 16px 20px; }
        .daily-card-hero .word-title { font-size: 1.9rem; }
        .daily-card-body { padding: 16px; gap: 12px; }
        .info-block-value.definition { font-size: 1.05rem; }
        .info-block-value.verse-text { font-size: 1.15rem; }
        .flashcard { border-radius: 20px; }
        .flashcard-word { font-size: 1.8rem; }
        .past-item { padding: 8px 10px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="practice-container">

    <!-- Tab Switcher -->
    <div class="practice-tabs">
        <button class="practice-tab active" id="tab-word" onclick="switchTab('word')">
            <span class="tab-emoji">🔤</span> Word
        </button>
        <button class="practice-tab" id="tab-verse" onclick="switchTab('verse')">
            <span class="tab-emoji">📖</span> Verse
        </button>
    </div>

    <!-- Word Tab Content -->
    <div id="panel-word">
        <!-- Loading Shimmer (shown while fetching) -->
        <div id="word-loading" class="shimmer-card">
            <div class="shimmer-line title"></div>
            <div class="shimmer-line subtitle"></div>
            <div class="shimmer-line body"></div>
            <div class="shimmer-line body"></div>
            <div class="shimmer-line body-short"></div>
        </div>

        <!-- Today's Word Card (hidden until loaded) -->
        <div id="word-card" style="display: none;"></div>

        <!-- Past Words Section -->
        <div id="word-history" style="display: none;">
            <div class="section-divider">
                <div class="section-divider-line"></div>
                <span class="section-divider-text">Past Words</span>
                <div class="section-divider-line"></div>
            </div>
            <div id="word-streak"></div>
            <div id="word-past-list" class="past-list"></div>
            <button class="review-btn" id="word-review-btn" onclick="startReview('english')" style="display: none;">
                🔄 Quick Review
            </button>
        </div>
    </div>

    <!-- Verse Tab Content -->
    <div id="panel-verse" style="display: none;">
        <!-- Loading Shimmer -->
        <div id="verse-loading" class="shimmer-card">
            <div class="shimmer-line title"></div>
            <div class="shimmer-line subtitle"></div>
            <div class="shimmer-line body"></div>
            <div class="shimmer-line body"></div>
            <div class="shimmer-line body-short"></div>
        </div>

        <!-- Today's Verse Card -->
        <div id="verse-card" style="display: none;"></div>

        <!-- Past Verses Section -->
        <div id="verse-history" style="display: none;">
            <div class="section-divider">
                <div class="section-divider-line"></div>
                <span class="section-divider-text">Past Verses</span>
                <div class="section-divider-line"></div>
            </div>
            <div id="verse-streak"></div>
            <div id="verse-past-list" class="past-list"></div>
            <button class="review-btn" id="verse-review-btn" onclick="startReview('bible')" style="display: none;">
                🔄 Quick Review
            </button>
        </div>
    </div>

</div>

<!-- Flashcard Review Overlay -->
<div class="flashcard-overlay" id="flashcard-overlay">
    <button class="flashcard-close" onclick="closeReview()">✕</button>
    <div class="flashcard">
        <div class="flashcard-front">
            <div class="flashcard-word" id="flashcard-word"></div>
            <div class="flashcard-prompt" id="flashcard-prompt">Do you remember what this means?</div>
        </div>
        <div class="flashcard-answer" id="flashcard-answer">
            <div class="flashcard-definition" id="flashcard-definition"></div>
        </div>
        <div class="flashcard-actions" id="flashcard-actions">
            <button class="flashcard-btn reveal" id="flashcard-reveal-btn" onclick="revealFlashcard()">
                Tap to Reveal
            </button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="practice-toast" id="practice-toast"></div>

{% endblock %}

{% block extra_js %}
<script src="{% static 'js/bible_memory.js' %}?v=200"></script>
{% endblock %}
